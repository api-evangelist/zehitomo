aid: zehitomo
name: Zehitomo
description: >-
  Zehitomo is a Tokyo-based online marketplace that matches consumers in Japan with local
  professionals across hundreds of service categories — including photographers, personal
  trainers, house cleaners, graphic and web designers, videographers, tax accountants,
  interpreters, construction and repair trades, and business consultants. Clients describe
  the job they need done and receive quotes and proposals from vetted local pros, while
  professionals pay to respond to matched leads. Founded in 2015 and backed by 500 Global,
  Zehitomo runs a consumer-facing web and mobile product; it does not publish a public
  developer API, SDK, or developer portal.
